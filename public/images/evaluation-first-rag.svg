<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="48" font-size="28" font-weight="700" fill="#1e293b">Evaluation-first RAG</text>
  <text x="30" y="74" font-size="15" fill="#64748b">Score retrieval and generation separately</text>

  <!-- Question in -->
  <text x="155" y="104" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">question</text>
  <line x1="155" y1="110" x2="155" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retrieval -->
  <rect x="30" y="130" width="250" height="140" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="155" y="162" font-size="17" font-weight="700" fill="#3730a3" text-anchor="middle">1 · Retrieval</text>
  <rect x="50" y="178" width="210" height="32" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="155" y="199" font-size="14" fill="#1e293b" text-anchor="middle">BM25 + dense (hybrid)</text>
  <rect x="50" y="220" width="210" height="32" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="155" y="241" font-size="14" fill="#1e293b" text-anchor="middle">cross-encoder rerank</text>

  <!-- top-k -->
  <line x1="280" y1="200" x2="318" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="299" y="190" font-size="12" fill="#64748b" text-anchor="middle">top-k</text>

  <!-- Generation -->
  <rect x="320" y="130" width="250" height="140" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="445" y="162" font-size="17" font-weight="700" fill="#86198f" text-anchor="middle">2 · Generation</text>
  <rect x="340" y="178" width="210" height="32" rx="6" fill="#ffffff" stroke="#f0abfc"/>
  <text x="445" y="199" font-size="14" fill="#1e293b" text-anchor="middle">LLM + citations</text>
  <rect x="340" y="220" width="210" height="32" rx="6" fill="#ffffff" stroke="#f0abfc"/>
  <text x="445" y="241" font-size="14" fill="#1e293b" text-anchor="middle">abstain if unsupported</text>

  <!-- Answer out -->
  <line x1="445" y1="130" x2="445" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="104" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">answer</text>

  <!-- Metrics -->
  <line x1="155" y1="270" x2="155" y2="298" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="445" y1="270" x2="445" y2="298" stroke="#c026d3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="85" y="298" width="140" height="30" rx="15" fill="#4f46e5"/>
  <text x="155" y="318" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">recall@k</text>
  <rect x="335" y="298" width="220" height="30" rx="15" fill="#c026d3"/>
  <text x="445" y="318" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">groundedness · abstention</text>

  <!-- Golden set -->
  <line x1="155" y1="368" x2="155" y2="330" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <line x1="445" y1="368" x2="445" y2="330" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="30" y="368" width="540" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="300" y="392" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Hand-written golden set</text>
  <text x="300" y="413" font-size="13" fill="#92400e" text-anchor="middle">question · reference answer · relevant documents</text>
</svg>
